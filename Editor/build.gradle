apply plugin: 'application'
dependencies {
    implementation project(':Client')
    implementation project(':WorldEditor')
    implementation 'org.controlsfx:controlsfx:11.2.1'
    implementation 'com.jfoenix:jfoenix:9.0.10'
}
application { mainClass = 'com.rspsi.DesktopLauncher'; applicationName = 'RSPSi' }
run { standardInput = System.in }
distributions {
    main {
        contents {
            from(rootProject.file('LICENSE'))
            from(rootProject.file('tools')) { into 'tools'; exclude '__pycache__', 'test_*' }
            from(rootProject.file('docs')) { into 'docs' }
            from(project(':Plugins:Plugin742').layout.buildDirectory.dir('libs')) {
                into 'plugins/inactive'; include '*.jar'
            }
        }
    }
}
tasks.matching { it.name in ['installDist', 'distZip', 'distTar'] }.configureEach {
    dependsOn ':Plugins:Plugin742:jar'
}
tasks.withType(Test).configureEach {
    systemProperty 'xyren.ui.test', System.getProperty('xyren.ui.test', 'false')
    systemProperty 'xyren.editor.home', rootProject.projectDir.absolutePath
    // Native DLLs stay loaded for the worker lifetime on Windows. Keep them
    // outside each test's temporary user.home so its files can be cleaned up.
    systemProperty 'javafx.cachedir', layout.buildDirectory.dir('javafx-native-cache').get().asFile.absolutePath
}
